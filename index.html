<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khutbas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="51/icon-180.png">
<meta name="theme-color" content="#11161C">
<style>
:root {
  --ground: #F4F6F8; --surface: #FFFFFF; --ink: #151C24; --ink-soft: #4A5561;
  --accent: #B07A1E; --cue: #5A7D8C; --rule: #DDE3E9;
  --f-serif: ui-serif, "New York", Georgia, serif;
  --f-sans: -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #11161C; --surface: #182028; --ink: #E8EDF2; --ink-soft: #9FAEBC;
    --accent: #E0A94A; --cue: #7FA8BA; --rule: #26313B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #11161C; --surface: #182028; --ink: #E8EDF2; --ink-soft: #9FAEBC;
  --accent: #E0A94A; --cue: #7FA8BA; --rule: #26313B; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-sans); }
main {
  max-width: 34rem; margin-inline: auto;
  padding-inline: max(1.25rem, env(safe-area-inset-left));
  padding-block: calc(2.5rem + env(safe-area-inset-top, 0px)) 3rem;
}
.kicker { font: 600 0.72rem/1 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cue); }
h1 { font: 600 2rem/1.15 var(--f-serif); margin: 0.5rem 0 2rem; }
p.updated { margin: -1.25rem 0 1.5rem; font: 600 0.62rem/1.3 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
li { border-bottom: 1px solid var(--rule); }
a {
  display: grid; grid-template-columns: 2.75rem 1fr; gap: 0.75rem; align-items: baseline;
  padding-block: 1.1rem; color: var(--ink); text-decoration: none;
}
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.n { font: 600 1.6rem/1 var(--f-serif); color: var(--accent); }
.t { font-size: 1.05rem; line-height: 1.35; }
.t small { display: block; margin-top: 0.3rem; font: 600 0.65rem/1.3 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--cue); }
</style>
</head>
<body>
<main>
  <div class="kicker">Friday khutbas</div>
  <h1>Khutbas</h1>
  <p class="updated">Last updated: 2026-10-02 11:19 EDT</p>
  <ol>
    <li><a href="51/"><span class="n">51</span><span class="t">AI and the date palms<small>Delivery view</small></span></a></li>
  </ol>
</main>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
</body>
</html>
